# Versatile Integration Studio — production Kubernetes manifests
# Secrets MUST be provided via Secret references — never inline values.
---
apiVersion: v1
kind: Namespace
metadata:
  name: vis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vis-config
  namespace: vis
data:
  NODE_ENV: "production"
  VIS_PERSISTENCE: "supabase"
  VIS_SECRET_PROVIDER: "vault"
  PORT: "3001"
  VIS_SHUTDOWN_MS: "15000"
---
apiVersion: v1
kind: Secret
metadata:
  name: vis-secrets
  namespace: vis
type: Opaque
stringData:
  # Replace via sealed-secrets / external-secrets — placeholders only
  SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "CHANGE_ME"
  VIS_SECRET_MASTER_KEY: "CHANGE_ME"
  VAULT_ADDR: "http://vault:8200"
  VAULT_TOKEN: "CHANGE_ME"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vis-api
  namespace: vis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vis-api
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: vis-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: vis-backend:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: vis-config
            - secretRef:
                name: vis-secrets
          readinessProbe:
            httpGet:
              path: /api/vis/enterprise/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/vis/enterprise/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vis-worker
  namespace: vis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vis-worker
  template:
    metadata:
      labels:
        app: vis-worker
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: vis-backend:latest
          command: ["node", "dist/workers/main.js"]
          envFrom:
            - configMapRef:
                name: vis-config
            - secretRef:
                name: vis-secrets
          env:
            - name: VIS_ROLE
              value: worker
          readinessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vis-worker-hpa
  namespace: vis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vis-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: vis-api
  namespace: vis
spec:
  selector:
    app: vis-api
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vis-frontend
  namespace: vis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vis-frontend
  template:
    metadata:
      labels:
        app: vis-frontend
    spec:
      containers:
        - name: frontend
          image: vis-frontend:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vis-frontend
  namespace: vis
spec:
  selector:
    app: vis-frontend
  ports:
    - port: 80
      targetPort: 8080
---
# Redis / PostgreSQL are typically external managed services.
# Reference-only StatefulSet examples for non-prod:
apiVersion: v1
kind: ConfigMap
metadata:
  name: vis-data-plane-notes
  namespace: vis
data:
  postgres: "VIS state lives in the existing Supabase project. Apply supabase/migrations/20261010120000_vis_supabase_persistence.sql. Do not point VIS at a separate PostgreSQL server."
  redis: "Use managed Redis with REDIS_URL. Enable AOF for queue durability where required."
  secrets: "Never commit real secrets. Use ExternalSecrets / SealedSecrets to populate vis-secrets."
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vis-ingress
  namespace: vis
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: vis.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vis-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vis-frontend
                port:
                  number: 80
